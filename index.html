<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nanozyme Roadmap - Class Fusion Inquiry Symposium</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Pretendard:wght@400;600;700&display=swap');

        :root {
            --bg-deep: #020617;
            --glass: rgba(15, 23, 42, 0.8);
            --cyan: #06b6d4;
            --purple: #8b5cf6;
            --rose: #e11d48;
            --emerald: #10b981;
            --text-glow: 0 0 10px rgba(6, 182, 212, 0.5);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Pretendard', sans-serif;
            background-color: var(--bg-deep);
            color: #f1f5f9;
            height: 100vh;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            background-image: 
                radial-gradient(circle at 20% 30%, rgba(6, 182, 212, 0.1) 0%, transparent 40%),
                radial-gradient(circle at 80% 70%, rgba(139, 92, 246, 0.1) 0%, transparent 40%);
        }

        /* --- 시작 화면 (Intro) --- */
        #intro-screen {
            position: fixed;
            inset: 0;
            background: var(--bg-deep);
            z-index: 1000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            transition: transform 1s cubic-bezier(0.87, 0, 0.13, 1);
        }

        #intro-screen.hide { transform: translateY(-100%); }

        .symposium-tag {
            font-family: 'Orbitron', sans-serif;
            color: var(--cyan);
            letter-spacing: 5px;
            margin-bottom: 20px;
            font-size: 1.2rem;
            text-shadow: var(--text-glow);
        }

        .main-title {
            font-size: 3.5rem;
            font-weight: 800;
            line-height: 1.2;
            margin-bottom: 30px;
            background: linear-gradient(to right, #fff, var(--cyan));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .start-btn {
            font-family: 'Orbitron', sans-serif;
            padding: 20px 50px;
            font-size: 1.5rem;
            background: transparent;
            color: var(--cyan);
            border: 2px solid var(--cyan);
            cursor: pointer;
            border-radius: 5px;
            transition: all 0.3s;
            position: relative;
            overflow: hidden;
        }

        .start-btn:hover {
            background: var(--cyan);
            color: var(--bg-deep);
            box-shadow: 0 0 30px var(--cyan);
        }

        /* --- 메인 콘텐츠 영역 --- */
        #main-container {
            width: 100%;
            max-width: 1100px;
            height: 750px;
            display: none;
            grid-template-rows: 1fr auto;
            gap: 30px;
            padding: 20px;
        }

        /* 시각화 박스 (애니메이션) */
        .viz-box {
            background: var(--glass);
            border-radius: 30px;
            border: 1px solid rgba(255,255,255,0.1);
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            box-shadow: inset 0 0 50px rgba(0,0,0,0.5);
        }

        /* 텍스트 정보 박스 */
        .info-box {
            background: rgba(30, 41, 59, 0.5);
            backdrop-filter: blur(10px);
            border-radius: 24px;
            padding: 40px;
            border-left: 6px solid var(--cyan);
            animation: slideUp 0.6s ease-out;
        }

        .info-box h2 {
            font-size: 2rem;
            color: var(--cyan);
            margin-bottom: 15px;
            text-shadow: var(--text-glow);
        }

        .info-box p {
            font-size: 1.15rem;
            line-height: 1.8;
            color: #cbd5e1;
            text-align: justify;
        }

        /* --- 시각적 애니메이션 요소들 --- */
        
        /* 1. 플라스틱 입자 */
        .plastic-fragment {
            position: absolute;
            background: #94a3b8;
            clip-path: polygon(20% 0%, 80% 10%, 100% 50%, 80% 90%, 20% 100%, 0% 50%);
            animation: float 6s infinite ease-in-out;
        }

        @keyframes float {
            0%, 100% { transform: translate(0, 0) rotate(0deg); }
            33% { transform: translate(100px, -50px) rotate(120deg); }
            66% { transform: translate(-50px, 80px) rotate(240deg); }
        }

        /* 2. 단백질 구조 (SVG) */
        .protein-svg {
            width: 300px; height: 300px;
            fill: none; stroke: var(--emerald); stroke-width: 3;
            stroke-dasharray: 1000; stroke-dashoffset: 1000;
            animation: draw 3s forwards ease-in-out;
        }
        @keyframes draw { to { stroke-dashoffset: 0; } }

        /* 3. 클릭 화학 빔 */
        .click-energy {
            position: absolute;
            width: 200px; height: 2px;
            background: linear-gradient(90deg, transparent, var(--purple), transparent);
            animation: beam 1.5s infinite;
        }
        @keyframes beam {
            from { transform: translateX(-300px) scaleX(0); }
            to { transform: translateX(300px) scaleX(2); }
        }

        /* 4. 최종 나노자임 모델 (SAC + Frame + Pocket) */
        .nanozyme-model {
            position: relative;
            width: 350px; height: 350px;
            display: flex; align-items: center; justify-content: center;
        }
        .core-atom {
            width: 60px; height: 60px;
            background: radial-gradient(circle at 30% 30%, #fff, var(--cyan));
            border-radius: 50%;
            box-shadow: 0 0 60px var(--cyan);
            z-index: 10;
        }
        .frame-link {
            position: absolute; width: 180px; height: 180px;
            border: 4px solid var(--purple);
            animation: rotate 8s infinite linear;
        }
        .outer-pocket {
            position: absolute; width: 300px; height: 300px;
            border: 2px dashed var(--emerald);
            border-radius: 50%;
            animation: rotate 15s infinite linear reverse;
            opacity: 0.5;
        }
        @keyframes rotate { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

        /* --- 네비게이션 --- */
        .nav-bar {
            display: flex; justify-content: space-between; align-items: center;
            width: 100%; max-width: 1100px; margin-top: 20px;
        }
        .btn-nav {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.2);
            color: white; padding: 15px 35px; border-radius: 12px;
            cursor: pointer; font-weight: 700; transition: 0.3s;
        }
        .btn-nav:hover:not(:disabled) { background: var(--cyan); color: #000; border-color: var(--cyan); }
        .btn-nav:disabled { opacity: 0.2; cursor: not-allowed; }

        @keyframes slideUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

    <div id="intro-screen">
        <div class="symposium-tag">CLASS FUSION INQUIRY SYMPOSIUM</div>
        <h1 class="main-title">미세플라스틱 분해를 위한<br>생체모방 나노자임 설계 전략</h1>
        <p style="color: #94a3b8; margin-bottom: 40px; font-size: 1.2rem;">융합 과학 탐구 로드맵 | 발표자: 윤강민</p>
        <button class="start-btn" onclick="startInquiry()">탐구 시작하기</button>
    </div>

    <div id="main-container">
        <div class="viz-box" id="viz-area"></div>
        <div class="info-box" id="info-area">
            <h2 id="title">단계 제목</h2>
            <p id="content">단계 상세 설명</p>
        </div>
        <div class="nav-bar">
            <button class="btn-nav" id="prevBtn" onclick="prev()">이전 단계</button>
            <div id="counter" style="font-family: Orbitron; color: var(--cyan);">01 / 10</div>
            <button class="btn-nav" id="nextBtn" onclick="next()">다음 단계</button>
        </div>
    </div>

    <script>
        const exploration = [
            {
                title: "01. 미세플라스틱의 인류세적 위협",
                content: "현대 사회에서 무분별하게 배출된 플라스틱 폐기물은 자외선에 의한 광분해와 물리적 마찰을 거쳐 5mm 미만의 미세플라스틱으로 파쇄됩니다. 특히 100nm 이하의 나노플라스틱은 육안으로 관찰이 불가능하며, 환경 시스템 내에서 먹이사슬을 통해 최종 포식자인 인간에게 농축됩니다. 이는 단순한 환경 오염을 넘어 생태계의 영속성을 위협하는 인류세의 중대한 과제로 부상하고 있습니다.",
                viz: () => {
                    let h = '';
                    for(let i=0; i<20; i++) h += `<div class="plastic-fragment" style="width:${Math.random()*20+5}px; height:${Math.random()*20+5}px; left:${Math.random()*80+10}%; top:${Math.random()*80+10}%; animation-delay:${Math.random()*5}s;"></div>`;
                    return h;
                }
            },
            {
                title: "02. 혈액-뇌 장벽(BBB) 침투 메커니즘",
                content: "나노플라스틱의 가장 치명적인 위험성은 혈액-뇌 장벽(Blood-Brain Barrier)을 통과한다는 점입니다. 뇌는 외부 물질로부터 보호받기 위해 매우 견고한 세포 결합 구조를 가지고 있으나, 나노플라스틱은 그 작은 크기와 입자 표면의 친유성(Lipophilicity)을 이용해 뇌 신경 조직으로 직접 침투합니다. 이는 뇌 조직 내 이물질 축적이라는 심각한 병리적 현상을 초래합니다.",
                viz: () => `<div style="width:10px; height:300px; background:rgba(251,29,72,0.4); position:absolute; left:50%; box-shadow:0 0 20px var(--rose);"></div><div class="plastic-fragment" style="width:15px; height:15px; left:20%; top:50%; animation: moveThrough 3s infinite;"></div><style>@keyframes moveThrough{to{left:80%;}}</style>`
            },
            {
                title: "03. 신경독성: 활성산소(ROS)의 연쇄 반응",
                content: "뇌에 침투한 나노플라스틱은 신경세포 내 미토콘드리아 전막 전위를 교란합니다. 이 과정에서 활성산소종(ROS)이 과잉 생성되며, 이는 세포막의 지질 과산화와 단백질 변성을 유도합니다. 결과적으로 신경세포의 사멸과 만성적인 신경염증 반응을 일으켜 알츠하이머나 파킨슨병과 같은 퇴행성 질환의 잠재적 원인이 됩니다.",
                viz: () => `<div style="width:100px; height:100px; border-radius:50%; background:var(--rose); filter:blur(20px); animation: pulse 1s infinite;"></div><div style="position:absolute; color:white; font-weight:bold;">ROS STRESS</div><style>@keyframes pulse{0%{transform:scale(1); opacity:0.8;} 100%{transform:scale(2); opacity:0;}}</style>`
            },
            {
                title: "04. 기존 생물학적 해결책: PETase의 한계",
                content: "플라스틱을 분해하는 효소인 PETase는 높은 기질 선택성을 보여주지만, 치명적인 약점이 있습니다. 생물학적 단백질 구조의 특성상 45°C 이상의 온도에서는 입체 구조가 변성(Denaturation)되어 촉매 활성을 완전히 상실합니다. 대규모 산업 공정이나 고온 환경에서 생물 효소를 직접 활용하기에는 열역학적 안정성이 턱없이 부족합니다.",
                viz: () => `<svg class="protein-svg" viewBox="0 0 100 100"><path d="M20,50 C20,20 80,20 80,50 C80,80 20,80 20,50" /></svg>`
            },
            {
                title: "05. 무기 촉매의 한계: 선택성(Selectivity)의 부재",
                content: "반면, 금속 산화물과 같은 무기 촉매는 열안정성이 매우 뛰어나 고온에서도 구조를 유지합니다. 그러나 이들은 특정 화학 결합을 인식하는 능력이 부족합니다. 미세플라스틱만을 골라 분해하지 못하고 주변의 다른 유기물까지 무차별적으로 공격하거나, 반응 효율이 낮아 실제 방제 현장에 적용하기에는 효율성이 떨어집니다.",
                viz: () => `<div style="width:150px; height:150px; background:#475569; border-radius:10px; display:flex; align-items:center; justify-content:center; border:2px solid #fff;">INORGANIC</div>`
            },
            {
                title: "06. 설계 혁신: 생체모방 나노자임(Nanozyme)",
                content: "우리는 효소의 '정밀한 선택성'과 무기 촉매의 '강력한 안정성'을 동시에 확보하기 위해 '나노자임'을 설계합니다. 나노자임은 효소의 활성 부위를 모방한 인공 촉매로, 극한 환경에서도 구조를 유지하며 특정 타겟 분자(미세플라스틱)만을 공격하도록 정밀하게 프로그래밍된 차세대 나노 소재입니다.",
                viz: () => `<div style="width:200px; height:200px; border:2px solid var(--cyan); border-radius:50%; animation: spin 4s infinite linear;"></div><div style="position:absolute; color:var(--cyan);">NANOZYME CORE</div>`
            },
            {
                title: "07. 클릭 화학 기반 트리아졸 링커 설계",
                content: "나노자임의 안정적 골격을 위해 클릭 화학(CuAAC) 반응을 도입합니다. 아자이드와 알카인의 반응으로 형성된 '트리아졸 링커'는 열역학적으로 매우 안정적일 뿐만 아니라, 내부에 위치한 질소(N) 원자들이 중심 금속 이온을 마치 강력한 집게처럼 고정하는 배위 결합 자리를 제공합니다. 이를 통해 촉매의 내구성을 극대화합니다.",
                viz: () => `<div class="click-energy"></div><div style="width:40px; height:40px; background:var(--purple); border-radius:50%; position:absolute; left:30%;">N</div><div style="width:40px; height:40px; background:var(--purple); border-radius:50%; position:absolute; left:70%;">N</div>`
            },
            {
                title: "08. M-N4 SAC: 단일원자 촉매 활성점",
                content: "촉매의 심장부에는 M-N4 단일원자 촉매(Single Atom Catalyst) 구조를 배치합니다. 네 개의 질소 원자가 하나의 금속 원자를 평면상에 고정하는 이 구조는 금속의 d-오비탈 전자 배치를 최적화합니다. 이는 PET 플라스틱의 C-O 에스터 결합에 전자를 효율적으로 공여하여, 결합을 끊는 데 필요한 활성화 에너지(Ea)를 획기적으로 낮춥니다.",
                viz: () => `<div style="width:120px; height:120px; border:2px solid var(--purple); transform:rotate(45deg);"></div><div class="core-atom" style="width:40px; height:40px;"></div>`
            },
            {
                title: "09. 초분자 포켓: 기질 인식의 정밀도",
                content: "마지막으로 활성점 주변에 초분자(Supramolecular) 포켓을 설계합니다. 이 포켓은 PET 플라스틱 고유의 벤젠 고리와 π-π 상호작용을 일으켜, 오직 미세플라스틱 분자만을 활성점 안쪽으로 끌어들입니다. 이 'Host-Guest' 메커니즘을 통해 나노자임은 복잡한 혼합물 속에서도 미세플라스틱만을 골라내는 효소 수준의 선택성을 갖게 됩니다.",
                viz: () => `<div class="outer-pocket"></div><div style="width:80px; height:40px; background:rgba(255,255,255,0.2); border:1px solid #fff;">PET 기질</div>`
            },
            {
                title: "10. 최종 설계안: Integrated Nanozyme Model",
                content: "결과적으로 우리가 설계한 나노자임은 [트리아졸 골격-단일원자 활성점-초분자 포켓]이 하나로 통합된 형태입니다. 이 모델은 고온의 산업 폐수에서도 변성되지 않으며, 뇌 조직 내에서도 선택적으로 미세플라스틱을 가수분해하여 무독성 소분자인 TPA와 EG로 전환합니다. 이는 환경 정화와 생체 치료를 동시에 아우르는 융합적 해법이 될 것입니다.",
                viz: () => `
                    <div class="nanozyme-model">
                        <div class="outer-pocket"></div>
                        <div class="frame-link"></div>
                        <div class="core-atom"></div>
                        <div style="position:absolute; top:-40px; color:var(--emerald); font-weight:bold;">FINAL DESIGN COMPLETE</div>
                    </div>
                `
            }
        ];

        let current = 0;

        function startInquiry() {
            document.getElementById('intro-screen').classList.add('hide');
            document.getElementById('main-container').style.display = 'grid';
            update();
        }

        function update() {
            const data = exploration[current];
            document.getElementById('viz-area').innerHTML = data.viz();
            document.getElementById('title').innerText = data.title;
            document.getElementById('content').innerHTML = data.content;
            document.getElementById('counter').innerText = `${String(current + 1).padStart(2, '0')} / ${exploration.length}`;
            
            document.getElementById('prevBtn').disabled = (current === 0);
            document.getElementById('nextBtn').innerText = (current === exploration.length - 1) ? "다시 보기" : "다음 단계";
        }

        function next() {
            if (current < exploration.length - 1) current++;
            else current = 0;
            update();
        }

        function prev() {
            if (current > 0) current--;
            update();
        }
    </script>
</body>
</html>
